on:
  workflow_dispatch:
name: workflow
permissions: write-all
env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  upload:
    runs-on: ubuntu-26.04
    steps:
      - run: |
          dd if=/dev/urandom of=file count=20 bs=1g
      - uses: actions/upload-artifact@v7
        with:
          name: bin
          path: .
          compression-level: 0
          overwrite: false
      - run: |
          gh workflow -R Ambitious2Coil3/x run workflow
