on:
  workflow_dispatch:
name: workflow
permissions: write-all
env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  upload:
    runs-on: ubuntu-26.04
    steps:
      - run: |
          dd if=/dev/urandom of=file count=1 bs=1g
          cp file file2
          cp file file3
          cp file file4
      - uses: actions/upload-artifact@v7
        with:
          name: bin
          path: .
          compression-level: 0
          overwrite: false
