on:
  workflow_dispatch:
name: workflow

jobs:
  this:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: thisart
      - run: |
          cat disk >> disk
      - uses: actions/upload-artifact@v7
        with:
          name: thisart
          path: disk
          compression-level: 0
    
      
