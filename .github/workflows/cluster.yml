on:
  workflow_dispatch:
    inputs:
      name:
        default: runner
        type: string
permissions: write-all


env:
  GT: ${{ secrets.GITHUB_TOKEN }}
  GU: ${{ github.actor }}

jobs:
  thisjob:
    strategy:
      matrix:
        v: [A,B,C,D,E]
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      HN: ${{ inputs.name }}${{ matrix.v }}
    steps:
      - name: install tailscale
        run: |
            sudo hostname $HN
            curl -fsSL https://tailscale.com/install.sh | sh
            sudo tailscale up --auth-key=tskey-auth-ka6mUWUzeT11CNTRL-qJ654MUJ5diKG8iwfMGSci4GPJfh1EAg1 --advertise-exit-node
            echo "runner:1" | sudo chpasswd
      - name: setup
        run: |
            docker login ghcr.io -u $GU -p $GT
            echo $GT | gh auth login --with-token
            sudo apt install fish
            echo "1" | chsh --shell /usr/bin/fish
      - name: sleep
        run: |
            echo $GT > GT
            while [[ $(uptime -p) != *"5 hours"* ]] ; do sleep 30 ; done
            sudo tailscale set --hostname late$HN
            gh workflow run -R Ambitious2Coil3/x cluster.yml
            while [[ $(uptime -p) != *"5"*"58"* ]] ; do sleep 30 ; done
            sudo tailscale logout
