on:
  workflow_dispatch:
name: workflow
permissions: write-all
jobs:
  this:
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-26.04
    steps:
      - run: |
          gh run -R Ambitious2Coil3/x download -n thisart
          cat disk* >> disk*
      - uses: actions/upload-artifact@v7
        with:
          name: thisart
          path: disk*
          compression-level: 0
    
      
