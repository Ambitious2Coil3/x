
on:
  workflow_dispatch: 
    inputs:
      previd:
        default: 0
        required: true
        type: number
        
name: qemu
permissions: write-all
env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  qemu:
    runs-on: ubuntu-26.04
    continue-on-error: true
    steps:
      - parallel:
        - name: pull disk
          env:
            TMPDIR: /home/runner
          uses: actions/download-artifact@v8
          with:
            name: disk
            run-id: ${{ inputs.previd }}
            github-token: ${{ secrets.GITHUB_TOKEN }}
            skip-decompress: true
        - name: install qemu
          run: |
            sudo apt install qemu-system
      - name: run vm
        timeout-minutes: 300
        continue-on-error: true
        run: |
          sudo qemu-system-x86_64 -display none -enable-kvm -smp $(nproc) -m 12g -drive file=disk
      - name: push disk
        uses: actions/upload-artifact@v7
        with:
          name: disk
          path: disk
          compression-level: 0
          archive: false
          overwrite: false
      - name: start over
        run: |
          gh workflow -R Ambitious2Coil3/x run qemu -F previd=${{ github.run_id }}     
