on:
  workflow_dispatch:
name: workflow
permissions: write-all
jobs:
  upload:
    runs-on: ubuntu-26.04
    steps:
      - run: dd if=/dev/urandom of=file count=5 bs=2g
      - uses: actions/upload-artifact@v7
        with:
          name: bin
          path: file
          compression-level: 0
          overwrite: true
  download:
    needs: upload
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: thisart
          github-token: ${{ secrets.GITHUB_TOKEN }}
          
