on:
  workflow_dispatch: 
name: qemu
permissions: write-all
env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  qemu:
    runs-on: ubuntu-26.04
    steps:
      - parallel:
        - name: pull disk
          run: |
            gh run -R Ambitious2Coil3/x download -n disk
        - name: install qemu
          run: |
            sudo apt install qemu-system
      - name: run vm
        run: |
          sudo qemu-system-x86_64 -display none -daemonize -enable-kvm -smp $(nproc) -m 12g -drive file=disk
      - name: sleep loop
        run: |
          while [[ $(uptime -p) != *"5"*"10"* ]] ; do sleep 30 ; done
      - name: stop vm
        run: |
          sudo pkill -f qemu
      - name: push disk
        uses: actions/upload-artifact@v7
        with:
          name: disk
          path: disk
          overwrite: false
      - name: start over
        run: |
          gh workflow -R Ambitious2Coil3/x run qemu
        
